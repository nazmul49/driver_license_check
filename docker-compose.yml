services:
  mysql:
    image: mysql:8.0
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--default-time-zone=+00:00',
      ]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dlc
      MYSQL_USER: dlc
      MYSQL_PASSWORD: dlc
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-udlc', '-pdlc']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    command: ['npm', 'run', 'start', '-w', 'server']
    env_file: server/.env
    environment:
      DB_HOST: mysql
      TZ: UTC
    ports:
      - '3000:3000'
    volumes:
      - images:/app/server/var/images
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    command: ['npm', 'run', 'start:worker', '-w', 'server']
    env_file: server/.env
    environment:
      DB_HOST: mysql
      TZ: UTC
    volumes:
      - images:/app/server/var/images
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  images:
