# Local stack. The MySQL service comes from the database project (database/docker-compose.yml),
# built from database/Dockerfile with the schema in it. Same project name as that file, so
# database/build_db.sh and this file manage the same container and volume.
name: dlc-dev

include:
  - database/docker-compose.yml

services:
  api:
    build: .
    command: ['npm', 'run', 'start', '-w', 'server']
    env_file: server/.env
    environment:
      # server/.env is written for running on the host (MySQL on localhost:3307). Inside the
      # compose network MySQL is the "mysql" service on its container port 3306.
      DB_HOST: mysql
      DB_PORT: 3306
      TZ: UTC
    ports:
      - '3000:3000'
    volumes:
      - images:/app/server/var/images
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    command: ['npm', 'run', 'start:worker', '-w', 'server']
    env_file: server/.env
    environment:
      # server/.env is written for running on the host (MySQL on localhost:3307). Inside the
      # compose network MySQL is the "mysql" service on its container port 3306.
      DB_HOST: mysql
      DB_PORT: 3306
      TZ: UTC
    volumes:
      - images:/app/server/var/images
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  images:
